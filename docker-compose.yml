# OpsMate 智能运维平台 - Docker Compose 配置（生产版 + 自动升级）
# 一键启动所有服务：Nginx / PostgreSQL(主+从) / TDengine / Redis(主+Sentinel) / Backend / Celery Worker
# 
# 启动：docker compose up -d
# 升级：docker compose pull && docker compose up -d
# 自动升级：Watchtower 容器自动检测新镜像并更新

# ---------- 镜像配置 ----------
# 开发构建：使用 build 指令（默认）
# 生产部署：设置 OPSMATE_VERSION 环境变量，自动使用远端镜像
#
# OpsMate 自有镜像（backend/nginx），通过以下变量控制：
#   - IMAGE_REGISTRY：镜像仓库地址
#   - IMAGE_NAMESPACE：镜像命名空间
#
# 第三方基础镜像（postgres/redis/tdengine/watchtower），通过以下变量控制：
#   - BASE_REGISTRY：基础镜像仓库地址（默认 docker.io，国内可设为ACR）
#   - BASE_NAMESPACE：基础镜像命名空间
#
# 常用配置：
#   国内用户（ACR全量）：IMAGE_REGISTRY=crpi-xxx  IMAGE_NAMESPACE=opsmate  BASE_REGISTRY=crpi-xxx  BASE_NAMESPACE=opsmate
#   国内用户（GHCR镜像站）：IMAGE_REGISTRY=ghcr.nju.edu.cn  IMAGE_NAMESPACE=matthew-jj 或 matthew-jiang-cn（v2.26.24 双账号轮换，按发布账号）
#   海外用户：无需配置，默认 ghcr.io + docker.io
x-backend-image: &backend-image
  image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-matthew-jj}/opsmate-backend:${OPSMATE_VERSION:-latest}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      APP_VERSION: ${OPSMATE_VERSION:-0.0.0}

x-nginx-image: &nginx-image
  image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-matthew-jj}/opsmate-nginx:${OPSMATE_VERSION:-latest}
  build:
    context: .
    dockerfile: Dockerfile.nginx

# ---------- YAML Anchors: 后端服务共享配置 ----------
x-backend-common: &backend-common
  <<: *backend-image
  env_file:
    - ./backend/.env
  networks:
    - opsmate-net

x-backend-env: &backend-env
  DISABLE_CAPTCHA: ${DISABLE_CAPTCHA:-true}
  # ENCRYPTION_KEY 和 JWT_SECRET_KEY 必须在 backend/.env 中设置
  # 不在此处设默认值，避免空字符串覆盖 .env 中的有效值
  DATABASE_URL: postgresql+asyncpg://opsmate:${POSTGRES_PASSWORD:-opsmate_dev_2026}@postgres:5432/opsmate
  DATABASE_URL_SYNC: postgresql://opsmate:${POSTGRES_PASSWORD:-opsmate_dev_2026}@postgres:5432/opsmate
  DATABASE_URL_READONLY: postgresql+asyncpg://opsmate:${POSTGRES_PASSWORD:-opsmate_dev_2026}@postgres-replica:5432/opsmate
  DATABASE_URL_READONLY_SYNC: postgresql://opsmate:${POSTGRES_PASSWORD:-opsmate_dev_2026}@postgres-replica:5432/opsmate
  REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_2026}@redis:6379/0
  REDIS_SENTINEL_URL: sentinel://:${REDIS_PASSWORD:-redis_dev_2026}@redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379/0
  TDENGINE_URL: tdengine
  TDENGINE_PORT: "6041"
  TDENGINE_USER: ${TDENGINE_USER:-root}
  TDENGINE_PASSWORD: ${TDENGINE_PASSWORD:-taosdata}
  # 代理配置：如需通过代理访问外网，取消注释并填写代理地址
  # 留空字符串会导致 httpx 连接失败（httpx 会尝试解析空字符串为代理URL）
  # HTTP_PROXY: "http://proxy.example.com:8080"
  # HTTPS_PROXY: "http://proxy.example.com:8080"
  # http_proxy: "http://proxy.example.com:8080"
  # https_proxy: "http://proxy.example.com:8080"
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,*.internal,172.16.0.0/16,10.0.0.0/8,192.168.0.0/16}
  # License 持久化目录（挂载到 /opt/opsmate/license，避免容器重建丢失 license.lic）
  LICENSE_DIR: /opt/opsmate/license
  # LLM 配置：通过环境变量传入，避免前端配置在容器重启后丢失
  # 留空表示未配置，AI功能将提示用户前往系统设置配置
  LLM_PROVIDER: ${LLM_PROVIDER:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  # Watchtower API Token：与Watchtower --http-api-token一致，后端触发自动升级时使用
  WATCHTOWER_API_TOKEN: ${WATCHTOWER_API_TOKEN:-opsmate-watchtower-2026}
  # 版本更新检查源（多镜像回退：主源→镜像→备用）
  UPDATE_CHECK_URL: ${UPDATE_CHECK_URL:-https://ghfast.top/https://raw.githubusercontent.com/MatthewJ-JJ/OpsMate-updates/main/manifest.json}
  UPDATE_CHECK_MIRROR_URL: ${UPDATE_CHECK_MIRROR_URL:-https://raw.githubusercontent.com/MatthewJ-JJ/OpsMate-updates/main/manifest.json}
  UPDATE_CHECK_FALLBACK_URL: ${UPDATE_CHECK_FALLBACK_URL:-http://122.51.177.113:9090/static/manifest.json}

x-redis-image: &redis-image
  image: ${BASE_REGISTRY:-docker.io}/${BASE_NAMESPACE:-library}/redis:7-alpine

x-postgres-image: &postgres-image
  image: ${BASE_REGISTRY:-docker.io}/${BASE_NAMESPACE:-library}/postgres:16-alpine

x-tdengine-image: &tdengine-image
  image: ${BASE_REGISTRY:-docker.io}/${BASE_NAMESPACE:-library}/tdengine:3.3.6.13

x-watchtower-image: &watchtower-image
  image: ${BASE_REGISTRY:-docker.io}/${BASE_NAMESPACE:-library}/watchtower:1.7.1

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-sentinel-common: &sentinel-common
  <<: *redis-image
  restart: unless-stopped
  logging: *default-logging
  environment:
    REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_2026}
  entrypoint: []
  command:
    - sh
    - -c
    - |
      REDIS_IP=$$(getent hosts redis | awk '{print $$1}')
      if [ -z "$$REDIS_IP" ]; then REDIS_IP="redis"; fi
      echo "Resolved redis to: $$REDIS_IP"
      cat > /tmp/sentinel.conf <<EOF
      port 26379
      sentinel resolve-hostnames yes
      sentinel monitor opsmate-master $$REDIS_IP 6379 2
      sentinel auth-pass opsmate-master $${REDIS_PASSWORD:-redis_dev_2026}
      sentinel down-after-milliseconds opsmate-master 30000
      sentinel failover-timeout opsmate-master 180000
      sentinel parallel-syncs opsmate-master 1
      EOF
      exec redis-sentinel /tmp/sentinel.conf
  depends_on:
    redis:
      condition: service_healthy
    redis-replica:
      condition: service_started
  healthcheck:
    test: ["CMD-SHELL", "redis-cli -p 26379 sentinel get-master-addr-by-name opsmate-master | grep -q . || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 15s
  networks:
    - opsmate-net

services:
  # ========== Nginx 反向代理 + 前端静态托管 ==========
  nginx:
    <<: *nginx-image
    container_name: opsmate-nginx
    restart: unless-stopped
    logging: *default-logging
    ports:
      # ⚠️ 生产环境已强制 HTTPS：HTTP(8080) 端口映射已关闭，仅保留 HTTPS(8443) 入口
      # 访问地址: https://<host>:8443 （HTTP 请求会被 nginx 301 到 HTTPS）
      # - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      # SSL证书目录：为空时nginx自动生自签名证书；生产环境放真实证书
      - ./ssl:/etc/nginx/ssl
    environment:
      # 代理配置：如需通过代理访问外网，取消注释并填写代理地址
      # HTTP_PROXY: "http://proxy.example.com:8080"
      # HTTPS_PROXY: "http://proxy.example.com:8080"
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,backend,*.internal,172.16.0.0/16,10.0.0.0/8,192.168.0.0/16}
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - opsmate-net
    # Watchtower 升级标签
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ========== PostgreSQL 主库（v2.0.0 全量预装镜像：表结构+SNMP+种子数据） ==========
  postgres:
    <<: *postgres-image
    container_name: opsmate-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: opsmate
      POSTGRES_USER: opsmate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsmate_dev_2026}
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-repl_dev_2026}
    # ⚠️ 审计 P1-2：默认已注释——数据库/缓存端口不暴露到宿主机，公网部署零暴露面；
    # 本地调试需要直连时取消下行注释
    # ports:
    #   - "5432:5432"  # 仅开发/调试使用
    volumes:
      - postgres_data:/var/lib/postgresql/data
    entrypoint: []
    command:
      - bash
      - -c
      - |
        docker-entrypoint.sh postgres -c shared_buffers=512MB -c effective_cache_size=1536MB -c work_mem=16MB -c maintenance_work_mem=256MB -c max_connections=200 -c random_page_cost=1.1 -c checkpoint_completion_target=0.9 -c wal_buffers=16MB -c default_statistics_target=100 -c log_min_duration_statement=1000 -c wal_level=replica -c max_wal_senders=3 -c wal_keep_size=64MB -c hot_standby=on &
        POSTGRES_PID=$$!
        until pg_isready -U "$${POSTGRES_USER:-opsmate}" -d "$${POSTGRES_DB:-opsmate}" 2>/dev/null; do sleep 1; done
        printf "ALTER USER \"$${POSTGRES_USER:-opsmate}\" WITH PASSWORD '$${POSTGRES_PASSWORD}';\\n" | psql -v ON_ERROR_STOP=1 --username "$${POSTGRES_USER:-opsmate}" --dbname "$${POSTGRES_DB:-opsmate}" >/dev/null 2>&1 || true
        echo "[OK] Database user password synced"
        wait $$POSTGRES_PID
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsmate"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opsmate-net

  # ========== PostgreSQL 从库（只读副本 + 故障切换热备） ==========
  postgres-replica:
    <<: *postgres-image
    container_name: opsmate-postgres-replica
    restart: unless-stopped
    logging: *default-logging
    environment:
      PGUSER: opsmate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsmate_dev_2026}
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-repl_dev_2026}
      POSTGRES_PRIMARY_HOST: postgres
      POSTGRES_PRIMARY_PORT: "5432"
    # ⚠️ 审计 P1-2：默认已注释——从库端口不暴露到宿主机；本地调试需要时取消下行注释
    # ports:
    #   - "5433:5432"  # 仅开发/调试使用
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    entrypoint: []
    command:
      - bash
      - -c
      - |
        set -e
        DATA_DIR="/var/lib/postgresql/data"
        if [ ! -f "$$DATA_DIR/PG_VERSION" ]; then
          echo "=== Replica: empty data dir, running pg_basebackup from primary ==="
          rm -rf "$$DATA_DIR"/*
          PGPASSWORD="$$POSTGRES_REPLICATION_PASSWORD" pg_basebackup \
            -h "$$POSTGRES_PRIMARY_HOST" \
            -p "$${POSTGRES_PRIMARY_PORT:-5432}" \
            -U replicator \
            -D "$$DATA_DIR" \
            -Fp -Xs -P -R
          echo "=== Replica: pg_basebackup completed ==="
        else
          echo "=== Replica: data directory exists, starting normally ==="
        fi
        cat >> "$$DATA_DIR/postgresql.auto.conf" <<EOF
        hot_standby = on
        max_connections = 200
        shared_buffers = 256MB
        effective_cache_size = 768MB
        work_mem = 16MB
        EOF
        exec /usr/local/bin/docker-entrypoint.sh postgres \
          -c hot_standby=on \
          -c max_connections=200 \
          -c shared_buffers=256MB \
          -c effective_cache_size=768MB \
          -c work_mem=16MB
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsmate"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - opsmate-net

  # ========== TDengine 时序数据库 ==========
  tdengine:
    <<: *tdengine-image
    container_name: opsmate-tdengine
    restart: unless-stopped
    logging: *default-logging
    # ⚠️ 审计 P1-2：默认已注释——时序库端口不暴露到宿主机；本地调试需要时取消下行注释
    # ports:
    #   - "6030:6030"  # 仅开发/调试使用
    #   - "6041:6041"  # 仅开发/调试使用
    environment:
      # 探活脚本用：taos CLI 凭据须与 .env 的 TDENGINE_USER/TDENGINE_PASSWORD 一致（专用用户须允许本机登录）
      TDENGINE_USER: ${TDENGINE_USER:-root}
      TDENGINE_PASSWORD: ${TDENGINE_PASSWORD:-taosdata}
    volumes:
      - tdengine_data:/var/lib/taos
    healthcheck:
      # 双密码探测：新密码或初始密码 taosdata 任一可连即 healthy。
      # 新装首启时密码同步（ALTER）由部署脚本在 healthy 后执行，期间用初始密码探活避免死锁等待（审计 P1-2）
      test: ["CMD-SHELL", "taos -u $$TDENGINE_USER -p\"$${TDENGINE_PASSWORD}\" -s 'SELECT server_version();' 2>/dev/null || taos -u $$TDENGINE_USER -ptaosdata -s 'SELECT server_version();' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opsmate-net

  # ========== Redis 主节点 ==========
  redis:
    <<: *redis-image
    container_name: opsmate-redis
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_dev_2026} --maxmemory 512mb --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_2026}
    # ⚠️ 审计 P1-2：默认已注释——Redis端口不暴露到宿主机；本地调试需要时取消下行注释
    # ports:
    #   - "6379:6379"  # 仅开发/调试使用
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opsmate-net

  # ========== Redis 从节点 ==========
  redis-replica:
    <<: *redis-image
    container_name: opsmate-redis-replica
    restart: unless-stopped
    logging: *default-logging
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_dev_2026}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --replicaof redis 6379
      --masterauth ${REDIS_PASSWORD:-redis_dev_2026}
      --replica-read-only yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_2026}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - opsmate-net

  # ========== Redis Sentinel × 3 ==========
  redis-sentinel-1:
    <<: *sentinel-common
    container_name: opsmate-sentinel-1

  redis-sentinel-2:
    <<: *sentinel-common
    container_name: opsmate-sentinel-2

  redis-sentinel-3:
    <<: *sentinel-common
    container_name: opsmate-sentinel-3

  # ========== Init：挂载卷权限自愈（v2.26.22 根修，一次性服务） ==========
  # 每次 docker compose up 必然先把挂载卷 chown 给 uid 1000，再拉起业务容器。
  # 根因（2026-09-28 233 升级翻车）：升级脚本"5/8 自我更新"时 mv 覆盖正在执行的自己，
  # bash 继续执行旧脚本逻辑，新加的 chown 步骤本次不生效；非 root 新镜像接管 root 属主
  # 旧日志文件后 PermissionError 崩溃循环。权限修复必须挂在"每次启动必然执行"的入口，
  # 不能依赖升级脚本的执行时序。init 完成后 backend/celery/flow-receiver 才会启动。
  init:
    <<: *backend-image
    container_name: opsmate-init
    user: root
    restart: "no"
    # v2.26.28 根修（233升级实测）：init 之前缺 env，persist_machine_fingerprint
    # 调 get_settings() fail-fast（JWT_SECRET_KEY/DATABASE_URL 未配置）后走免底，
    # 根相位指纹在 DMI 仅 root 可读的机器上退化；与 backend 同源注入环境
    env_file:
      - ./backend/.env
    networks:
      - opsmate-net
    logging: *default-logging
    environment:
      <<: *backend-env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[init] 计算机器指纹（root 相位，DMI 仅 root 可读）-> license/machine_fingerprint.raw"
        LICENSE_DIR=/opt/opsmate/license python3 -c "from app.core.license import persist_machine_fingerprint; persist_machine_fingerprint()" || echo "[init] WARN: 机器指纹计算失败（非致命，应用层将现场采集，非 root 下指纹可能退化）"
        echo "[init] chown 挂载卷 -> 1000:1000 (ssl/reports/logs/license)"
        chown -R 1000:1000 /opt/opsmate/ssl /opt/opsmate/reports /opt/opsmate/logs /opt/opsmate/license || echo "[init] WARN: chown 部分失败（对应卷可能未挂载），继续启动"
        echo "[init] done"
    volumes:
      - ${OPSMATE_DIR:-/opt/opsmate}/ssl:/opt/opsmate/ssl
      - ${OPSMATE_DIR:-/opt/opsmate}/reports:/opt/opsmate/reports
      - ${OPSMATE_DIR:-/opt/opsmate}/logs:/opt/opsmate/logs
      - ${OPSMATE_DIR:-/opt/opsmate}/license:/opt/opsmate/license

  # ========== Backend API (FastAPI + Uvicorn 4 Workers) ==========
  backend:
    <<: *backend-common
    container_name: opsmate-backend
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ${OPSMATE_DIR:-/opt/opsmate}/reports:/opt/opsmate/reports
      - ${OPSMATE_DIR:-/opt/opsmate}/logs:/opt/opsmate/logs
      - ${OPSMATE_DIR:-/opt/opsmate}/license:/opt/opsmate/license
    ports:
      # - "8000:8000"  # ⚠️ 已禁用：绕过nginx安全头/限速，生产环境勿开
      - "162:162/udp"   # SNMP Trap
      - "1514:514/udp"   # Syslog（非root Docker需用高端口映射）
    # 审计 P1-1：非 root（uid 1000）绑定 162/514 特权端口。
    # 233 实测：cap_add 对非 root 进程无效（能力不落 effective set），实际机制是
    # 镜像内 setcap 文件能力（Dockerfile 给 python 授 CAP_NET_BIND_SERVICE）；
    # cap_add 保留作运行时差异时的补充，无副作用
    cap_add:
      - NET_BIND_SERVICE
    environment:
      <<: *backend-env
      MIGRATION_ROLE: primary   # entrypoint.sh 迁移失败硬退出（celery/flow-receiver 用 entrypoint:[] 不受影响）
      DISCOVERY_FULL_TIMEOUT: "180"
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      tdengine:
        condition: service_healthy
    command: >
      python -m uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 4
      --loop uvloop
      --http httptools
      --log-config logging_config.json
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/system/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Watchtower 升级标签
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ========== Celery Worker (16并发) ==========
  celery:
    <<: *backend-common
    container_name: opsmate-celery
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ${OPSMATE_DIR:-/opt/opsmate}/reports:/opt/opsmate/reports
      - ${OPSMATE_DIR:-/opt/opsmate}/logs:/opt/opsmate/logs
      - ${OPSMATE_DIR:-/opt/opsmate}/license:/opt/opsmate/license
    environment:
      <<: *backend-env
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      tdengine:
        condition: service_healthy
      backend:
        condition: service_started
    entrypoint: []
    command: >
      celery -A app.celery_app worker
      -l info
      -P prefork
      -c 16
      --max-tasks-per-child=100
      -Q celery,power
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping --timeout 5 2>/dev/null | grep -q pong || (pgrep -f 'celery.*worker' > /dev/null && exit 0) || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 45s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ========== NPM Flow Receiver ==========
  flow-receiver:
    <<: *backend-common
    container_name: opsmate-flow-receiver
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ${OPSMATE_DIR:-/opt/opsmate}/license:/opt/opsmate/license
    ports:
      - "2055:2055/udp"
      - "2056:2056/udp"
      - "6343:6343/udp"
      - "4739:4739/udp"
    environment:
      <<: *backend-env
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      tdengine:
        condition: service_healthy
    entrypoint: []
    command: python -m app.services.npm.receiver
    healthcheck:
      # v2.26.07: 二进制安全探针。旧写法 cat /proc/1/cmdline | tr '\0' ' ' 中
      # YAML 双引号会把 \0 解析成真实 NUL 字节注入命令串，sh 收到含 NUL 的命令
      # 直接报 exec /bin/sh: invalid argument 导致容器 unhealthy（130/SIPG 实锤）
      test: ["CMD-SHELL", "grep -aq receiver /proc/1/cmdline || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ========== Watchtower - 用户触发升级 ==========
  # 不会自动轮询拉取镜像，仅在用户点击"一键升级"时通过 HTTP API 触发
  # 只更新带 watchtower.enable=true 标签的容器
  watchtower:
    <<: *watchtower-image
    container_name: opsmate-watchtower
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json:ro
    environment:
      # 自动适配 Docker Engine API 版本，避免 "client version too new" 错误
      # 不设置则 Watchtower 自动协商，设为环境变量可覆盖
      DOCKER_API_VERSION: ${DOCKER_API_VERSION:-1.43}
    command: >
      --http-api-update
      --http-api-token ${WATCHTOWER_API_TOKEN:-opsmate-watchtower-2026}
      --cleanup
      --label-enable
    ports:
      - "127.0.0.1:8081:8080"  # 仅本机可访问Watchtower API
    networks:
      - opsmate-net

volumes:
  postgres_data:
    name: opsmate_postgres_data
  postgres_replica_data:
    name: opsmate_postgres_replica_data
  tdengine_data:
    name: opsmate_tdengine_data
  redis_data:
    name: opsmate_redis_data

networks:
  opsmate-net:
    driver: bridge
    name: opsmate-network
